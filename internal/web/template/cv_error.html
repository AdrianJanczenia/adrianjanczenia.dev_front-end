<!doctype html>
<html lang="{{.Lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>{{.HTTPStatus}} — {{.ErrorTitle}}</title>
    <link rel="stylesheet" href="{{staticAssetURL "/static/css/portfolio.css"}}">
</head>
<body class="error-centered-body">
    <main class="error-centered-container">
        <p class="eyebrow">CV / HTTP {{.HTTPStatus}}</p>
        <h1>{{.ErrorTitle}}</h1>
        <div class="styled-block">
            <p>{{.ErrorMessage}}</p>
        </div>
        <div class="error-actions">
            <a href="/?lang={{.Lang}}" class="modal-btn">{{.HomeLabel}}</a>
        </div>
    </main>
</body>
</html>
