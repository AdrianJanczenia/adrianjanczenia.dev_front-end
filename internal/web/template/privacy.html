{{define "content"}}
<article class="privacy-page page-section">
    <p class="eyebrow">{{.Content.Shared.Footer.Privacy}}</p>
    <h1>{{.Content.Pages.Privacy.Title}}</h1>
    {{range .Content.Pages.Privacy.Sections}}
    <section>
        <h2>{{.Header}}</h2>
        {{range .Items}}
        <div class="privacy-item">
            {{if .Label}}<h3>{{.Label}}</h3>{{end}}
            <p>{{.Text}}</p>
        </div>
        {{end}}
    </section>
    {{end}}
</article>
{{end}}
