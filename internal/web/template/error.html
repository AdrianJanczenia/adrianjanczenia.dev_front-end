<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{{.HTTPStatus}} — {{.ErrorTitle}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
</head>
<body class="error-centered-body">
<main class="error-centered-container">
    <h1 class="content-header"><span>{{.ErrorHeader}}::</span> {{.HTTPStatus}}</h1>
    <div class="styled-block">
        <span class="key">{{.StatusKey}}</span>: <span class="string">"{{.HTTPStatus}}"</span>,
        <br>
        <span class="key">{{.MessageKey}}</span>: <span class="string">"{{.ErrorMessage}}"</span>
    </div>
    <div class="error-actions">
        <a href="/?lang={{.Lang}}" class="modal-btn">{{.HomeLabel}}</a>
    </div>
    <nav class="lang-switcher error-lang-switcher" aria-label="{{.LanguageLabel}}">
        <a href="?lang=pl" lang="pl" hreflang="pl" aria-label="Polski" {{if eq .Lang "pl"}}class="active" aria-current="page"{{end}}>🇵🇱</a>
        <a href="?lang=en" lang="en" hreflang="en" aria-label="English" {{if eq .Lang "en"}}class="active" aria-current="page"{{end}}>🇬🇧</a>
    </nav>
</main>
</body>
</html>
